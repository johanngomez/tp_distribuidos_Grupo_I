syntax = "proto3";

package rentar.customer.v1;

//le dicen a Maven cómo generar el código en Java
option java_package = "ar.edu.unla.rentar.customer.grpc";
option java_multiple_files = true;

//definimos los métodos que el Gateway de Python va a poder llamar
service CustomerService {
  // Autentica un usuario y devuelve un JWT.
  rpc Login (LoginRequest) returns (LoginResponse);
  // Lista los clientes administrados por este servicio.
  rpc ListarClientes (ListarClientesRequest) returns (ListarClientesResponse);
  // Obtiene un cliente por identificador.
  rpc GetCliente (ObtenerClienteRequest) returns (ClienteResponse);
  // Busca un cliente por su email.
  rpc ObtenerClientePorEmail (ClienteEmailRequest) returns (ClienteResponse);
  // Crea un cliente validando sus datos obligatorios.
  rpc CrearCliente (CrearClienteRequest) returns (ClienteResponse);
  // Modifica los datos editables de un cliente.
  rpc ModificarCliente (ModificarClienteRequest) returns (ClienteResponse);
  // Realiza la baja logica de un cliente.
  rpc DarDeBajaCliente (DarDeBajaClienteRequest) returns (OperacionClienteResponse);
  // Verifica que un cliente exista, este activo y pueda alquilar.
  rpc ValidarCliente (ValidarClienteRequest) returns (ValidacionResponse);
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message LoginResponse {
  string token = 1;
  string tipo = 2;
  bool es_admin = 3;
}

message ListarClientesRequest {}

message ListarClientesResponse {
  repeated ClienteResponse clientes = 1;
}

//"message" son las variables que viajan por la red
message ObtenerClienteRequest {
  int64 id_cliente = 1;
}

message ValidarClienteRequest {
  int64 id_cliente = 1;
}

message ClienteEmailRequest {
  string email = 1;
}

message ClienteResponse {
  int64 id_cliente = 1;
  string documento = 2;
  string nombre = 3;
  string apellido = 4;
  string email = 5;
  string telefono = 6;
  string fecha_nacimiento = 7;
  bool activo = 8;
  bool es_admin = 9;
}

message CrearClienteRequest {
  string documento = 1;
  string nombre = 2;
  string apellido = 3;
  string email = 4;
  string telefono = 5;
  string fecha_nacimiento = 6;
  string password = 7;
}

message ModificarClienteRequest {
  int64 id_cliente = 1;
  string nombre = 2;
  string apellido = 3;
  string telefono = 4;
  string fecha_nacimiento = 5;
}

message DarDeBajaClienteRequest {
  int64 id_cliente = 1;
}

message OperacionClienteResponse {
  bool exito = 1;
  string mensaje = 2;
}

message ValidacionResponse {
  bool existe = 1;
  bool activo = 2;
  bool puede_alquilar = 3;
}
