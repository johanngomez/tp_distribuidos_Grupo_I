syntax = "proto3";

option java_multiple_files = true;
option java_package = "ar.unla.rentar.grpc.rental.v1";

package rentar.rental.v1;

service RentalService {
    // Crea una reserva con el precio ya resuelto por el Gateway.
    rpc CrearReserva (CrearReservaRequest) returns (ReservaResponse);
    // Consulta reservas aplicando los filtros recibidos.
    rpc ConsultarReservas (ConsultarReservasRequest) returns (ConsultarReservasResponse);
    // Cancela una reserva perteneciente al cliente indicado.
    rpc CancelarReserva (CancelarReservaRequest) returns (CancelarReservaResponse);
    // Devuelve el historial resumido del cliente, sin consultar otros servicios.
    rpc ConsultarHistorialCliente (ConsultarHistorialClienteRequest) returns (ConsultarHistorialClienteResponse);

}

enum EstadoReserva {
    SIN_ESPECIFICAR = 0;
    EN_CURSO = 1;
    CONFIRMADA = 2;
    FINALIZADA = 3;
    CANCELADA = 4;
}

//request

message CrearReservaRequest {
    int64 cliente_id = 1; // Cliente previamente validado por el Gateway.
    int64 vehiculo_id = 2; // Vehiculo previamente validado por el Gateway.
    string fecha_inicio = 3; // Fecha/hora ISO-8601 de inicio.
    string fecha_fin = 4; // Fecha/hora ISO-8601 de finalizacion.
    double precio_diario = 5; // Precio resuelto por Vehicle Service.
}

//todos los campos son opcionales, si no se envía un campo, no se filtrará por ese campo
message ConsultarReservasRequest {
  // El Gateway resuelve el email y envía el ID del cliente.
  int64 cliente_id = 1;
  int64 vehiculo_id = 2;
  // El contrato de reservas no depende del contrato de vehículos.
  EstadoReserva estado = 3;
  string fecha_inicio = 4;
  string fecha_fin = 5;

}

message CancelarReservaRequest {
  int64 reserva_id = 1; // Reserva a cancelar.
  int64 cliente_id = 2; // Cliente propietario; cero solo para administradores.
}

message ConsultarHistorialClienteRequest {
  int64 cliente_id= 1;
}

//responses

message ReservaResponse {
    int64 id = 1;
    int64 cliente_id = 2;
    int64 vehiculo_id = 3;
    string fecha_inicio = 4;
    string fecha_fin = 5;
    double precio_diario = 6;
    double importe_total = 7;
    EstadoReserva estado = 8;
}

message ConsultarReservasResponse {
  repeated ReservaResponse reservas = 1;
}

message CancelarReservaResponse {
  bool exito = 1;
  ReservaResponse reserva = 2;
}

message HistorialResponse {
  int64 reserva_id = 1;
  int64 cliente_id = 2;
  int64 vehiculo_id = 3;
  string fecha_inicio = 4;
  string fecha_fin = 5;
  int64 cantidad_dias = 6;
  double importe_total = 7;
  string estado = 8;
}

message ConsultarHistorialClienteResponse {
  repeated HistorialResponse reservas = 1;
}

