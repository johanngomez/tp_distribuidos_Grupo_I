spring.datasource.url=jdbc:mysql://localhost:${DB_PORT:3306}/${DB_NAME:rentar}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
grpc.server.port=${GRPC_PORT:50053}
server.port=${SERVER_PORT:8084}

# RabbitMQ (Hito 3)
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:rentar}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:rentar}
