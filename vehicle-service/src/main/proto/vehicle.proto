syntax = "proto3";

package rentar.vehicle.v1;

option java_multiple_files = true;
option java_outer_classname = "VehiculoProto";
option java_package = "ar.unla.rentar.grpc.vehicle.v1";

service VehicleService {
  rpc ListarVehiculos(ListarVehiculosRequest) returns (ListarVehiculosResponse);
  rpc CrearVehiculo(CrearVehiculoRequest) returns (Vehiculo);
  rpc ActualizarVehiculo(ActualizarVehiculoRequest) returns (Vehiculo);
  rpc ObtenerVehiculo(ObtenerVehiculoRequest) returns (Vehiculo);
  rpc EliminarVehiculo(EliminarVehiculoRequest) returns (EliminarVehiculoResponse);
}

message ListarVehiculosRequest {}

message ListarVehiculosResponse {
  repeated Vehiculo vehiculos = 1;
}

message CrearVehiculoRequest {
  string patente = 1;
  string marca = 2;
  string modelo = 3;
  int32 anio = 4;
  optional string color = 5;
  TipoVehiculo tipo = 6;
  double precio_diario = 7;
}

message ObtenerVehiculoRequest {
  int64 id = 1;
}

message ActualizarVehiculoRequest {
  int64 id = 1;
  string patente = 2;
  string marca = 3;
  string modelo = 4;
  int32 anio = 5;
  optional string color = 6;
  TipoVehiculo tipo = 7;
  double precio_diario = 8;
}

message EliminarVehiculoRequest {
  int64 id = 1;
}

message EliminarVehiculoResponse {
  bool exito = 1;
}

enum TipoVehiculo {
  VEHICULO_TIPO_SIN_ESPECIFICAR = 0;
  SEDAN = 1;
  SUV = 2;
  PICKUP = 3;
  COUPE = 4;
  HATCHBACK = 5;
}

enum EstadoVehiculo {
  VEHICULO_ESTADO_SIN_ESPECIFICAR = 0;
  DISPONIBLE = 1;
  RESERVADO = 2;
  EN_ALQUILER = 3;
}

message Vehiculo {
  int64 id = 1;
  string patente = 2;
  string marca = 3;
  string modelo = 4;
  int32 anio = 5;
  optional string color = 6;
  TipoVehiculo tipo = 7;
  double precio_diario = 8;
  EstadoVehiculo estado = 9;
  bool activo = 10;
}
