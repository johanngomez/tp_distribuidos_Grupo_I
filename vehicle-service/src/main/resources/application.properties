# Puerto del Servidor gRPC (donde escuchará llamadas del Gateway en Python)
grpc.server.port=50051

# Puerto HTTP del Microservicio
server.port=8082

# Configuración de Base de Datos MySQL (Base desacoplada para Vehículos)
spring.datasource.url=jdbc:mysql://localhost:${DB_PORT:3306}/${DB_NAME:rentar_vehiculos}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración Hibernate / JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# RabbitMQ (Hito 3)
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:rentar}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:rentar}
