# Configuración de Base de Datos MySQL (Base desacoplada para Vehículos)
spring.datasource.url=jdbc:mysql://localhost:${DB_PORT:3306}/${DB_NAME:rentar}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:}
jwt.secret=${JWT_SECRET}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# Puerto del Servidor gRPC (donde escuchará llamadas del Gateway en Python)
grpc.server.port=50051

# Puerto HTTP del Microservicio
server.port=8082
