syntax = "proto3";

package rentar.vehicle.v1;

option java_multiple_files = true;
option java_outer_classname = "VehicleProto";
option java_package = "ar.unla.rentar.grpc.vehicle.v1";

// Contrato acordado para el primer flujo Gateway Python ↔ Vehicle Service Java.
service VehicleService {
  rpc ListVehicles(ListVehiclesRequest) returns (ListVehiclesResponse);
}

message ListVehiclesRequest {}

message ListVehiclesResponse {
  repeated Vehicle vehicles = 1;
}

// Valores equivalentes a ar.unla.rentar.model.TipoVehiculo.
enum VehicleType {
  VEHICLE_TYPE_UNSPECIFIED = 0;
  SEDAN = 1;
  SUV = 2;
  PICKUP = 3;
  COUPE = 4;
  HATCHBACK = 5;
}

// Valores equivalentes a ar.unla.rentar.model.EstadoVehiculo.
enum VehicleStatus {
  VEHICLE_STATUS_UNSPECIFIED = 0;
  DISPONIBLE = 1;
  RESERVADO = 2;
  EN_ALQUILER = 3;
}

// Campos equivalentes a VehiculoResponseDTO del Hito 1.
message Vehicle {
  int64 id = 1;
  string patente = 2;
  string marca = 3;
  string modelo = 4;
  int32 anio = 5;
  optional string color = 6;
  VehicleType tipo = 7;
  double precio_diario = 8;
  VehicleStatus estado = 9;
  bool activo = 10;
}
